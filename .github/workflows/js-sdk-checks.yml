name: JS SDK Checks
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: js-sdk-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/sdk-setup
        with:
          cwd: .
          mode: lockfile
      - uses: ./.github/actions/sdk-setup
        with:
          cwd: .
      - run: node --test scripts/tests/*.test.cjs
      - run: node scripts/sdk-preflight.cjs --root . --checks
